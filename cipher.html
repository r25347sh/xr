<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Cipher</title>
  <link rel="stylesheet" href="css/room.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <script src="js/gate.js" data-autorun="1" defer></script>
  <script src="js/peer-util.js" defer></script>
  <script src="js/cipher.js" defer></script>
</head>
<body>
  <div id="deny" class="deny"><div class="deny-code">404</div><p class="deny-msg">not found</p></div>
  <div id="app" class="hidden">
    <div class="top"><a href="index.html">← hub</a><span class="name">Cipher</span><span id="badge" class="badge">offline</span></div>
    <div class="wrap">
      <div class="mode-tabs" id="mode-tabs">
        <button type="button" class="mode-tab active" data-mode="host">Host</button>
        <button type="button" class="mode-tab" data-mode="join">Join</button>
      </div>
      <section id="panel-host" class="panel">
        <label>shared passphrase</label><input type="password" id="host-pass" maxlength="128">
        <div class="actions">
          <button type="button" id="btn-host" class="btn primary">open</button>
          <button type="button" id="btn-host-stop" class="btn ghost hidden">close</button>
        </div>
        <div id="host-info" class="hidden" style="margin-top:0.75rem">
          <div class="url-row"><input id="share-url" readonly><button type="button" id="btn-copy" class="btn ghost">copy</button></div>
        </div>
        <p id="host-status" class="status"></p>
      </section>
      <section id="panel-join" class="panel hidden">
        <label>shared passphrase</label><input type="password" id="join-pass" maxlength="128">
        <label>room id</label><input type="text" id="room-input">
        <div class="actions"><button type="button" id="btn-join" class="btn primary">join</button></div>
        <p id="join-status" class="status"></p>
      </section>
      <section id="stage" class="panel hidden">
        <div id="chat-log" class="chat-log"></div>
        <form id="chat-form" class="chat-form">
          <input type="text" id="chat-input" placeholder="encrypted message" maxlength="2000">
          <button type="submit" class="btn primary">send</button>
        </form>
        <p style="font-size:0.65rem;color:#5a5a6a;margin-top:0.5rem">AES-GCM · key from passphrase · ciphertext only on wire</p>
      </section>
    </div>
  </div>
  <div id="toast" class="toast"></div>
</body>
</html>
